name: MAIKO YEN Node 8 (5h Auto-Restart)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  repository_dispatch:
    types: [retrigger-maiko-node-8]
  schedule:
    # Optional scheduled trigger every 6 hours (fallback if dispatch is not used)
    - cron: '0 */5 * * *'

# Ensure ONLY ONE runner instance executes at any given time.
# Prevents spawning hundreds of parallel jobs.
concurrency:
  group: maiko-node-8-singleton
  cancel-in-progress: false

jobs:
  serve:
    name: Run MAIKO YEN Node 8
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    # Maximum execution limit on standard GitHub-hosted runners is 360 minutes (6 hours).
    # We set the job timeout to 350 minutes (~5h 50m) to allow clean shutdown and handoff.
    timeout-minutes: 350

    env:
      HOST: "0.0.0.0"
      PORT: "8000"
      MODEL_NAME: "qwen-0.5b"
      MODEL_FILE: "qwen2.5-0.5b-instruct-q4_k_m.gguf"
      MODEL_PATH: "models/qwen2.5-0.5b-instruct-q4_k_m.gguf"
      MODEL_URL: "https://huggingface.co/bartowski/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf"
      CONTEXT_SIZE: "2048"
      THREADS: "2"
      BATCH_SIZE: "512"
      MAX_TOKENS: "512"
      TEMPERATURE: "0.7"
      # ~5 hours per server process restart inside this workflow run (18000s)
      RESTART_INTERVAL_SECONDS: "18000"
      RUN_SINGLE_CYCLE: "true"
      # Secrets from GitHub Repository Secrets (with built-in direct fallback)
      API_KEY: ${{ secrets.API_KEY || 'qwen3-direct-access' }}
      GH_PAT: ${{ secrets.GH_PAT }}
      CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
      TARGET_REPO: "yasamarium/llm"

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Install System Dependencies & Cloudflared
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl build-essential libgomp1
          # Install cloudflared for public tunneling
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          rm cloudflared.deb
          cloudflared --version

      - name: 4. Install Python Dependencies & llama-cpp-python CPU Wheel
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Install CPU-optimized llama-cpp-python prebuilt binary (AVX2 / OpenMP enabled)
          pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu || pip install llama-cpp-python

      - name: 5. Cache Model Weights (Optimistic)
        id: cache-model
        uses: actions/cache@v4
        with:
          path: models/
          key: model-qwen3-4b-v1-${{ hashFiles('scripts/download_model.py') }}
          restore-keys: |
            model-qwen3-4b-v1-

      - name: 6. Download Qwen3 4B GGUF Model
        run: |
          python scripts/download_model.py

      - name: 7. Run Automated Tests
        run: |
          # Fast unit testing with mock mode enabled
          MOCK_MODEL=true pytest tests/test_api.py -v

      - name: 8. Start Server & Public Tunnel (~5-Hour Active Session)
        run: |
          chmod +x scripts/start_server.sh
          ./scripts/start_server.sh

      - name: 9. Safe Workflow Retrigger (Job Handoff)
        if: always() && steps.cache-model.outcome != 'failure'
        run: |
          echo "Current runner session completed. Initiating handoff to next runner..."
          python scripts/retrigger_workflow.py
